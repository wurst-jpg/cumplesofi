<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Feliz Cumpleaños</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fdf0f5;
    }
    .scene {
      min-height: 100vh;
      width: 100%;
      background: linear-gradient(160deg, #fdf0f5 0%, #f5e6f8 40%, #e8f0fb 100%);
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .petals-bg { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    .petal { position: absolute; opacity: 0; animation: fall linear infinite; }
    @keyframes fall {
      0%   { opacity: 0; transform: translateY(-30px) rotate(0deg); }
      10%  { opacity: 0.7; }
      90%  { opacity: 0.5; }
      100% { opacity: 0; transform: translateY(110vh) rotate(360deg); }
    }
    .heart-row { display: flex; gap: 10px; margin-bottom: 2rem; }
    .heart { font-size: 18px; animation: pulse 1.4s ease-in-out infinite; }
    .heart:nth-child(2) { animation-delay: 0.2s; font-size: 28px; }
    .heart:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.3); }
    }
    .admiration {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: clamp(1.4rem, 4vw, 2rem);
      color: #c96aa0;
      text-align: center;
      margin-bottom: 0.5rem;
      letter-spacing: 0.04em;
    }
    .divider { display: flex; align-items: center; gap: 12px; margin: 1.2rem 0; }
    .divider-line { width: 55px; height: 1px; background: linear-gradient(to right, transparent, #c96aa0); }
    .divider-line.right { background: linear-gradient(to left, transparent, #c96aa0); }
    .divider-star { color: #c96aa0; font-size: 14px; }
    .cake-row { font-size: 44px; margin: 0.5rem 0 1.2rem; animation: bounce 2s ease-in-out infinite; }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-9px); }
    }
    .main-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.2rem, 7vw, 3.6rem);
      font-weight: 600;
      color: #7a3fa8;
      text-align: center;
      line-height: 1.15;
      margin-bottom: 0.2rem;
    }
    .subtitle {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: clamp(1.4rem, 4vw, 2.1rem);
      color: #c96aa0;
      text-align: center;
      margin-bottom: 1.8rem;
    }
    .footer-hearts { font-size: 13px; color: #c96aa0; letter-spacing: 0.3em; opacity: 0.7; margin-top: 1rem; }
    .sparkle { position: absolute; width: 5px; height: 5px; border-radius: 50%; opacity: 0; animation: sparkle 3s ease-in-out infinite; }
    @keyframes sparkle {
      0%, 100% { opacity: 0; transform: scale(0); }
      50% { opacity: 0.6; transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="petals-bg" id="petals"></div>

    <div class="heart-row">
      <span class="heart">♡</span>
      <span class="heart">♥</span>
      <span class="heart">♡</span>
    </div>

    <p class="admiration">Te admiro mucho, amor</p>

    <div class="divider">
      <div class="divider-line"></div>
      <span class="divider-star">✦</span>
      <div class="divider-line right"></div>
    </div>

    <div class="cake-row">🎂</div>

    <h1 class="main-title">Feliz</h1>
    <h2 class="subtitle">Cumpleaños</h2>

    <div class="divider">
      <div class="divider-line"></div>
      <span class="divider-star">✦</span>
      <div class="divider-line right"></div>
    </div>

    <p class="footer-hearts">✦ &nbsp; ♡ &nbsp; ✦</p>
  </div>

  <script>
    const petalsContainer = document.getElementById('petals');
    const symbols = ['✿','❀','✾','♡','❋','✦'];
    const colors = ['#e8a0c8','#c96aa0','#b07fcc','#7a3fa8','#f4b8d4','#9ab8f0'];
    for (let i = 0; i < 28; i++) {
      const el = document.createElement('span');
      el.className = 'petal';
      el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
      el.style.left = Math.random() * 100 + '%';
      el.style.color = colors[Math.floor(Math.random() * colors.length)];
      el.style.fontSize = (13 + Math.random() * 14) + 'px';
      el.style.animationDuration = (5 + Math.random() * 7) + 's';
      el.style.animationDelay = (Math.random() * 6) + 's';
      petalsContainer.appendChild(el);
    }
    const scene = document.querySelector('.scene');
    for (let i = 0; i < 10; i++) {
      const s = document.createElement('div');
      s.className = 'sparkle';
      s.style.left = (10 + Math.random() * 80) + '%';
      s.style.top = (10 + Math.random() * 80) + '%';
      s.style.background = colors[Math.floor(Math.random() * colors.length)];
      s.style.animationDelay = (Math.random() * 3) + 's';
      s.style.animationDuration = (2 + Math.random() * 2) + 's';
      scene.appendChild(s);
    }
  </script>
</body>
</html>
